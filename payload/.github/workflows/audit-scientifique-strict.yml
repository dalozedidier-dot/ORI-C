name: Audit scientifique strict ORI-C

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plateforme/source_corrigee/**'
      - 'plateforme/campagne_maximale_reelle/data/REAL_DATA_COVERAGE.json'
      - 'scripts/valider_barriere_scientifique_publication.py'
      - 'scripts/valider_resultats_reels_stricts.py'
      - '.github/workflows/audit-scientifique-strict.yml'

permissions:
  contents: read

jobs:
  audit-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Hydrater Git LFS
        run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Tester la barrière scientifique
        run: |
          python scripts/valider_barriere_scientifique_publication.py
          (cd plateforme/source_corrigee && PYTHONPATH=src python -m pytest -q)
      - name: Exécuter les 683 entrées en données réelles strictes
        working-directory: plateforme/source_corrigee
        run: |
          PYTHONPATH=src python -m oric_full.cli run \
            --all \
            --real-data-only \
            --data-dir ../campagne_maximale_reelle/data \
            --output-dir "$RUNNER_TEMP/oric-real-strict"
      - name: Vérifier indépendamment les PASS réels
        run: python scripts/valider_resultats_reels_stricts.py "$RUNNER_TEMP/oric-real-strict/results.json"
      - name: Publier l'audit strict
        uses: actions/upload-artifact@v6
        with:
          name: audit-scientifique-strict-${{ github.sha }}
          path: ${{ runner.temp }}/oric-real-strict/results.json
          if-no-files-found: error
          retention-days: 30
