[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oric-full-research"
version = "0.2.0"
description = "Plateforme exécutable couvrant l'ensemble des campagnes de tests ORI-C"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Didier Daloze"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "jsonschema>=4.21",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
science = ["numba>=0.60", "rebound>=4.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
oric-full = "oric_full.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oric_full = ["py.typed", "resources/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
