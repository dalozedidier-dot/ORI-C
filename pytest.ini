# Rend `pytest` exécutable depuis la racine du dépôt.
#
# Le dépôt réunit quatre projets, chacun avec sa disposition `src/` et son
# paquet. Chaque suite passe quand on l'exécute depuis son dossier avec le bon
# `PYTHONPATH` — c'est ce que fait la CI, et cela reste la référence. Mais un
# `pytest` lancé à la racine échouait à la collecte sur vingt-quatre modules.
# Deux causes distinctes :
#
#   1. `oric_full`, `oric_memory_tests`, `oric_solar_history` et
#      `scripts.build_max_validation_package` n'étaient pas importables. D'où
#      `pythonpath` ci-dessous. Cette option évite d'avoir à créer un
#      `conftest.py` racine, qui masquerait celui de `00_socle/tests` et
#      casserait `from conftest import lire_csv`. Le dossier `00_socle/tests`
#      figure lui aussi dans la liste : en mode importlib, pytest n'ajoute plus
#      le dossier du fichier de test au chemin de recherche, et cet import
#      explicite de `conftest` doit continuer de se résoudre.
#
#   2. Deux projets ont un fichier nommé `test_pipeline.py`, dans des dossiers
#      sans `__init__.py`. Le mode d'import hérité dérive le nom du module du
#      seul nom de base : les deux réclament `test_pipeline` et la collecte
#      s'interrompt sur un « import file mismatch ». `--import-mode=importlib`
#      importe chaque fichier sous son chemin complet, ce qui autorise les noms
#      de base répétés d'un projet à l'autre.
#
# Ce n'était pas un échec scientifique : les suites spécialisées passaient. Mais
# la commande la plus évidente donnait l'impression d'un dépôt cassé.
[pytest]
addopts = --import-mode=importlib
pythonpath =
    plateforme/source_corrigee/src
    02_branche_systeme_solaire/couche_memoire_historique/src
    02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests/src
    02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests
    00_socle/tests
