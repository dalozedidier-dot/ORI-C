<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Liberation Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="1.4" stdDeviation="1.8" flood-color="#1c2836" flood-opacity="0.16"/>
  </filter>
  <marker id="mFil" markerWidth="11" markerHeight="11" refX="8.2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0.5,0.6 L8.6,4 L0.5,7.4 Z" fill="#33556f"/>
  </marker>
  <marker id="mCon" markerWidth="12" markerHeight="12" refX="8.4" refY="4.2" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M1,1 L8.8,4.2 L1,7.4" fill="none" stroke="#c7922f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="mEnv" markerWidth="11" markerHeight="11" refX="8.2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0.5,0.6 L8.6,4 L0.5,7.4 Z" fill="#2e7d74"/>
  </marker>
  <marker id="mLec" markerWidth="12" markerHeight="12" refX="8.4" refY="4.2" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M1,1 L8.8,4.2 L1,7.4" fill="none" stroke="#3d7c54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="mCoeA" markerWidth="11" markerHeight="11" refX="8.2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0.5,0.6 L8.6,4 L0.5,7.4 Z" fill="#b0533e"/>
  </marker>
  <marker id="mCoeB" markerWidth="11" markerHeight="11" refX="2.6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M8.6,0.6 L0.5,4 L8.6,7.4 Z" fill="#b0533e"/>
  </marker>
  <marker id="mTra" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M4.5,0.8 L8.2,4.5 L4.5,8.2 L0.8,4.5 Z" fill="#7e5aa6"/>
  </marker>
</defs>

<text x="34" y="46" font-size="21" font-weight="700" fill="#23303e">Grammaire des figures</text>
<text x="34" y="70" font-size="13" fill="#5a6b7a">Quatre natures de noeuds · sept natures de liens</text>
<line x1="34" y1="86" x2="966" y2="86" stroke="#dfe5ec" stroke-width="1.5"/>
<text x="34" y="118" font-size="14" font-weight="700" fill="#23303e">NOEUDS</text>
<rect x="34" y="134" width="250" height="52" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="159.0" y="156.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Objet matériel</text>
<text x="159.0" y="174.0" text-anchor="middle" font-size="11" fill="#4b6076">architecture, réservoir, interface</text>
<path d="M43,206 L275,206 L284,215 L284,249 L275,258 L43,258 L34,249 L34,215 Z" fill="#f4ecdd" stroke="#9a7736" stroke-width="2" filter="url(#soft)"/>
<text x="159.0" y="228.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#5a4620">Mécanisme</text>
<text x="159.0" y="246.0" text-anchor="middle" font-size="11" fill="#7c6534">transformation, transport, tri</text>
<rect x="34" y="278" width="250" height="52" rx="11" fill="#fcf3e1" stroke="#c7922f" stroke-width="2" stroke-dasharray="6 4" filter="url(#soft)"/>
<text x="159.0" y="300.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#7c581a">Condition d'ouverture</text>
<text x="159.0" y="318.0" text-anchor="middle" font-size="11" fill="#9a7430">rend possible, sans transfert</text>
<rect x="34" y="350" width="250" height="52" rx="11" fill="#e9f3ec" stroke="#3d7c54" stroke-width="2" stroke-dasharray="2 4" filter="url(#soft)"/>
<text x="159.0" y="372.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#234b31">Métrique dérivée</text>
<text x="159.0" y="390.0" text-anchor="middle" font-size="11" fill="#3d6b4b">mesure lue sur un réservoir</text>
<text x="330" y="118" font-size="14" font-weight="700" fill="#23303e">LIENS</text>
<path d="M330,150 L422,150" fill="none" stroke="#33556f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mFil)"/>
<text x="438" y="148" font-size="13.5" font-weight="600" fill="#23303e">Filiation matérielle</text>
<text x="438" y="164" font-size="11.5" fill="#5a6b7a">transmet des constituants</text>
<path d="M330,195 L422,195" fill="none" stroke="#c7922f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#mCon)"/>
<text x="438" y="193" font-size="13.5" font-weight="600" fill="#23303e">Condition d'ouverture</text>
<text x="438" y="209" font-size="11.5" fill="#5a6b7a">rend une transition possible</text>
<path d="M330,240 L422,240" fill="none" stroke="#2e7d74" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mEnv)"/>
<text x="438" y="238" font-size="13.5" font-weight="600" fill="#23303e">Transformation environnementale</text>
<text x="438" y="254" font-size="11.5" fill="#5a6b7a">modifie le milieu</text>
<path d="M330,285 L422,285" fill="none" stroke="#3d7c54" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="1.5 4" marker-end="url(#mLec)"/>
<text x="438" y="283" font-size="13.5" font-weight="600" fill="#23303e">Lecture / dérivation</text>
<text x="438" y="299" font-size="11.5" fill="#5a6b7a">d'un réservoir vers une mesure</text>
<path d="M330,330 L422,330" fill="none" stroke="#8892a0" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="438" y="328" font-size="13.5" font-weight="600" fill="#23303e">Dépendance non généalogique</text>
<text x="438" y="344" font-size="11.5" fill="#5a6b7a">sans transfert de matière</text>
<path d="M330,375 L422,375" fill="none" stroke="#7e5aa6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#mTra)"/>
<text x="438" y="373" font-size="13.5" font-weight="600" fill="#23303e">Transmission de trace</text>
<text x="438" y="389" font-size="11.5" fill="#5a6b7a">signature de provenance</text>
<path d="M330,420 L422,420" fill="none" stroke="#b0533e" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mCoeA)" marker-start="url(#mCoeB)"/>
<text x="438" y="418" font-size="13.5" font-weight="600" fill="#23303e">Rétroaction / coévolution</text>
<text x="438" y="434" font-size="11.5" fill="#5a6b7a">entre réservoirs</text>
</svg>
