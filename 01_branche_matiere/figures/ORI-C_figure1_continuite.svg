<text x="34" y="42" font-size="19" font-weight="700" fill="#23303e">Continuité des architectures — de la matière au vivant</text>
<text x="34" y="63" font-size="12.5" fill="#5a6b7a">Épine de filiations matérielles ; conditions latérales ; inventaire lu, non traversé</text>
<path d="M430,125.0 L430,199.0" fill="none" stroke="#33556f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mFil)"/>
<path d="M430,265.0 L430,339.0" fill="none" stroke="#33556f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mFil)"/>
<path d="M430,405.0 L430,479.0" fill="none" stroke="#33556f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mFil)"/>
<path d="M430,545.0 L430,619.0" fill="none" stroke="#33556f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mFil)"/>
<path d="M430,685.0 L430,759.0" fill="none" stroke="#33556f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mFil)"/>
<path d="M430,825.0 L430,899.0" fill="none" stroke="#33556f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mFil)"/>
<path d="M430,965.0 L430,1039.0" fill="none" stroke="#33556f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mFil)"/>
<path d="M430,1105.0 L430,1179.0" fill="none" stroke="#33556f" stroke-width="2.4" stroke-linecap="round" marker-end="url(#mFil)"/>
<rect x="40" y="268" width="232" height="62" rx="11" fill="#fcf3e1" stroke="#c7922f" stroke-width="2" stroke-dasharray="6 4" filter="url(#soft)"/>
<text x="156.0" y="295.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#7c581a">H₂ / HD — refroidissement</text>
<text x="156.0" y="313.0" text-anchor="middle" font-size="11" fill="#9a7430">condition, non filiation matérielle</text>
<path d="M272,299.0 C327,299.0 360,302 426,302" fill="none" stroke="#c7922f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#mCon)"/>
<rect x="40" y="762" width="232" height="62" rx="11" fill="#fcf3e1" stroke="#c7922f" stroke-width="2" stroke-dasharray="6 4" filter="url(#soft)"/>
<text x="156.0" y="789.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#7c581a">²⁶Al · date d'accrétion</text>
<text x="156.0" y="807.0" text-anchor="middle" font-size="11" fill="#9a7430">chauffage radiogénique — condition</text>
<path d="M272,793.0 C312,793.0 250.0,792 276.0,792" fill="none" stroke="#c7922f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#mCon)"/>
<rect x="740" y="902" width="244" height="128" rx="11" fill="#e9f3ec" stroke="#3d7c54" stroke-width="2" stroke-dasharray="2 4" filter="url(#soft)"/>
<text x="862.0" y="955.5" text-anchor="middle" font-size="14.5" font-weight="600" fill="#234b31">Inventaire accessible</text>
<text x="862.0" y="973.5" text-anchor="middle" font-size="11" fill="#3d6b4b">stock · flux · contrefactuel — mesure</text>
<text x="862.0" y="986.5" text-anchor="middle" font-size="11" fill="#3d6b4b">dérivée, non une étape</text>
<path d="M580.0,932 C620.0,932 700,944 736,944" fill="none" stroke="#3d7c54" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="1.5 4" marker-end="url(#mLec)"/>
<path d="M580.0,1072 C620.0,1072 700,994 736,994" fill="none" stroke="#3d7c54" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="1.5 4" marker-end="url(#mLec)"/>
<path d="M566.0,1072 C640,1060 640,900 566.0,792" fill="none" stroke="#b0533e" stroke-width="2.2" stroke-linecap="round" marker-end="url(#mCoeA)" marker-start="url(#mCoeB)"/>
<text x="660.0" y="940.0" text-anchor="middle" font-size="11" font-style="italic" fill="#b0533e" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">recyclage · remise en circulation</text>
<rect x="280.0" y="59.0" width="300" height="66" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="430.0" y="88.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Constituants nucléaires</text>
<text x="430.0" y="106.0" text-anchor="middle" font-size="11" fill="#4b6076">protons, neutrons, noyaux</text>
<rect x="280.0" y="199.0" width="300" height="66" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="430.0" y="228.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Atomes et molécules</text>
<text x="430.0" y="246.0" text-anchor="middle" font-size="11" fill="#4b6076">liaisons, réactivité, refroidissement</text>
<rect x="280.0" y="339.0" width="300" height="66" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="430.0" y="368.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Grains, glaces et solides</text>
<text x="430.0" y="386.0" text-anchor="middle" font-size="11" fill="#4b6076">surfaces, adsorption, stockage</text>
<rect x="280.0" y="479.0" width="300" height="66" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="430.0" y="508.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Agrégats et collectifs</text>
<text x="430.0" y="526.0" text-anchor="middle" font-size="11" fill="#4b6076">porosité, couplage aérodynamique</text>
<rect x="280.0" y="619.0" width="300" height="66" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="430.0" y="648.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Planétésimaux</text>
<text x="430.0" y="666.0" text-anchor="middle" font-size="11" fill="#4b6076">gravité propre, intérieur, rétention</text>
<path d="M289.0,759.0 L571.0,759.0 L580.0,768.0 L580.0,816.0 L571.0,825.0 L289.0,825.0 L280.0,816.0 L280.0,768.0 Z" fill="#f4ecdd" stroke="#9a7736" stroke-width="2" filter="url(#soft)"/>
<text x="430.0" y="788.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#5a4620">Accrétion, chauffage, fusion</text>
<text x="430.0" y="806.0" text-anchor="middle" font-size="11" fill="#7c6534">différenciation métal-silicate</text>
<rect x="280.0" y="899.0" width="300" height="66" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="430.0" y="928.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Réservoirs différenciés</text>
<text x="430.0" y="946.0" text-anchor="middle" font-size="11" fill="#4b6076">noyau, manteau, croûte, enveloppes</text>
<rect x="280.0" y="1039.0" width="300" height="66" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="430.0" y="1068.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Interfaces réactives</text>
<text x="430.0" y="1086.0" text-anchor="middle" font-size="11" fill="#4b6076">gradients eau-roche-gaz, cycles</text>
<rect x="280.0" y="1179.0" width="300" height="66" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="430.0" y="1208.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Organisation chimique active</text>
<text x="430.0" y="1226.0" text-anchor="middle" font-size="11" fill="#4b6076">raccord vers la branche vivant</text>
<text x="439.0" y="166.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#33556f" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">chimie électronique</text>
<text x="439.0" y="306.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#33556f" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">condensation, refroidissement</text>
<text x="439.0" y="446.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#33556f" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">coagulation, dérive</text>
<text x="439.0" y="586.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#33556f" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">concentration, effondrement</text>
<text x="439.0" y="726.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#33556f" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">gravité propre</text>
<text x="439.0" y="866.0" text-anchor="start" font-size="10.5" font-style="italic" fill="#33556f" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">différenciation</text>
<text x="421.0" y="1006.0" text-anchor="end" font-size="10.5" font-style="italic" fill="#33556f" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">circulation entre réservoirs</text>
<text x="421.0" y="1146.0" text-anchor="end" font-size="10.5" font-style="italic" fill="#33556f" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">interfaces, cycles</text>
</svg>
