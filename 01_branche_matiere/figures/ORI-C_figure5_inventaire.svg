<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="'Liberation Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="1.4" stdDeviation="1.8" flood-color="#1c2836" flood-opacity="0.16"/>
  </filter>
  <marker id="mFil" markerWidth="11" markerHeight="11" refX="8.2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0.5,0.6 L8.6,4 L0.5,7.4 Z" fill="#33556f"/>
  </marker>
  <marker id="mCon" markerWidth="12" markerHeight="12" refX="8.4" refY="4.2" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M1,1 L8.8,4.2 L1,7.4" fill="none" stroke="#c7922f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="mEnv" markerWidth="11" markerHeight="11" refX="8.2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0.5,0.6 L8.6,4 L0.5,7.4 Z" fill="#2e7d74"/>
  </marker>
  <marker id="mLec" markerWidth="12" markerHeight="12" refX="8.4" refY="4.2" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M1,1 L8.8,4.2 L1,7.4" fill="none" stroke="#3d7c54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="mCoeA" markerWidth="11" markerHeight="11" refX="8.2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0.5,0.6 L8.6,4 L0.5,7.4 Z" fill="#b0533e"/>
  </marker>
  <marker id="mCoeB" markerWidth="11" markerHeight="11" refX="2.6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M8.6,0.6 L0.5,4 L8.6,7.4 Z" fill="#b0533e"/>
  </marker>
  <marker id="mTra" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M4.5,0.8 L8.2,4.5 L4.5,8.2 L0.8,4.5 Z" fill="#7e5aa6"/>
  </marker>
</defs>

<text x="34" y="42" font-size="19" font-weight="700" fill="#23303e">Trois niveaux de mesure du même inventaire</text>
<text x="34" y="63" font-size="12.5" fill="#5a6b7a">Lus sur un réservoir — aucune succession causale entre eux</text>
<rect x="46" y="210" width="210" height="100" rx="11" fill="#eaf0f7" stroke="#33556f" stroke-width="2" filter="url(#soft)"/>
<text x="151.0" y="256.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303f">Réservoir</text>
<text x="151.0" y="274.0" text-anchor="middle" font-size="11" fill="#4b6076">un stock, un instant, un horizon</text>
<rect x="560" y="96" width="400" height="96" rx="11" fill="#e9f3ec" stroke="#3d7c54" stroke-width="2" stroke-dasharray="2 4" filter="url(#soft)"/>
<text x="760.0" y="140.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#234b31">Stock accessible</text>
<text x="760.0" y="158.0" text-anchor="middle" font-size="11" fill="#3d6b4b">quantité mobilisable — ex. phosphates solubles</text>
<path d="M256,260.0 C346,260.0 470,144.0 556,144.0" fill="none" stroke="#3d7c54" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="1.5 4" marker-end="url(#mLec)"/>
<rect x="560" y="212" width="400" height="96" rx="11" fill="#e9f3ec" stroke="#3d7c54" stroke-width="2" stroke-dasharray="2 4" filter="url(#soft)"/>
<text x="760.0" y="256.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#234b31">Flux accessible</text>
<text x="760.0" y="274.0" text-anchor="middle" font-size="11" fill="#3d6b4b">quantité transférable — ex. circulation hydrothermale</text>
<path d="M256,260.0 C346,260.0 470,260.0 556,260.0" fill="none" stroke="#3d7c54" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="1.5 4" marker-end="url(#mLec)"/>
<rect x="560" y="328" width="400" height="96" rx="11" fill="#e9f3ec" stroke="#3d7c54" stroke-width="2" stroke-dasharray="2 4" filter="url(#soft)"/>
<text x="760.0" y="365.5" text-anchor="middle" font-size="14.5" font-weight="600" fill="#234b31">Variation contrefactuelle de l'accessibilité</text>
<text x="760.0" y="383.5" text-anchor="middle" font-size="11" fill="#3d6b4b">part libérée par une intervention — ex. après fusion ou</text>
<text x="760.0" y="396.5" text-anchor="middle" font-size="11" fill="#3d6b4b">hydratation</text>
<path d="M256,260.0 C346,260.0 470,376.0 556,376.0" fill="none" stroke="#3d7c54" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="1.5 4" marker-end="url(#mLec)"/>
<path d="M982,96 C996,96 996,212 996,260.0" fill="none" stroke="#b7bfc9" stroke-width="1.6"/>
<path d="M982,424 C996,424 996,308 996,260.0" fill="none" stroke="#b7bfc9" stroke-width="1.6"/>
<text x="1008" y="262" font-size="11.5" font-style="italic" fill="#6a7481" transform="rotate(90 1008 262)" text-anchor="middle">dérivation croissante, non une succession</text>
</svg>
