<text x="34" y="42" font-size="19" font-weight="700" fill="#23303e">Nature réelle des relations après reclassement</text>
<text x="34" y="63" font-size="12.5" fill="#5a6b7a">La plupart des liens décrivaient un contexte ou une condition, non un transfert de matière — 47 relations</text>
