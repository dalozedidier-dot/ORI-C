name: Audit empirique strict ORI-C

on:
  workflow_dispatch:
  push:
    paths:
      - 'plateforme/source_corrigee/src/oric_full/**'
      - 'plateforme/source_corrigee/tests/**'
      - 'plateforme/campagne_maximale_reelle/data/**'
      - 'plateforme/campagne_maximale_reelle/prioriser_donnees_manquantes.py'
      - 'plateforme/campagne_maximale_reelle/tests/test_priorites_acquisition.py'
      - 'plateforme/campagne_maximale_reelle/certifier_resultats_specialises.py'
      - 'plateforme/campagne_maximale_reelle/CERTIFICATIONS_SPECIALISEES.json'
      - 'plateforme/campagne_maximale_reelle/tests/test_certifications_specialisees.py'
      - '03_branche_vivant/benchmark_histoire_antibiotique_2026/resultats/RESULTAT.json'
      - '03_branche_vivant/lignees_vesicules/resultats/RESULTAT.json'
      - '01_branche_matiere/memoire_materielle_reelle/derive/SYNTHESE_CAMPAGNE.json'
      - 'plan_directeur/campagne_maximale_trois_branches/resultats/systeme_solaire_robustesse.json'
      - 'donnees_externes/donnees_reelles_2026_08_07/**'
      - 'scripts/valider_barriere_empirique.py'
      - 'scripts/auditer_donnees_reelles_2026_08_07.py'
      - '.github/workflows/audit-empirique-strict.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Hydrater Git LFS
        run: git lfs pull

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt

      - name: Installer les dépendances verrouillées
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt

      - name: Tester le pare-feu empirique
        run: python -m pytest -q plateforme/source_corrigee/tests/test_empirical_firewall.py plateforme/source_corrigee/tests/test_real_data_scope.py

      - name: Auditer les données intégrées du 7 août
        run: python scripts/auditer_donnees_reelles_2026_08_07.py

      - name: Valider la barrière empirique fail-closed
        run: python scripts/valider_barriere_empirique.py

      - name: Exécuter les 683 entrées en mode réel strict
        env:
          PYTHONPATH: plateforme/source_corrigee/src
        run: |
          rm -rf plateforme/campagne_maximale_reelle/resultats_empiriques/strict_683
          python -m oric_full.cli run --all \
            --data-dir plateforme/campagne_maximale_reelle/data \
            --output-dir plateforme/campagne_maximale_reelle/resultats_empiriques/strict_683 \
            --oric-root . \
            --real-data-only

      - name: Refuser tout soutien scientifique issu de la matrice générique
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('plateforme/campagne_maximale_reelle/resultats_empiriques/strict_683/results.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          counts = d['counts']
          sci = d['scientific_counts']
          expected = {'pass': 9, 'fail': 0, 'skip': 0, 'blocked': 626, 'error': 0, 'not_run': 48}
          assert counts == expected, (counts, expected)
          assert sci == {'undetermined': 635, 'supports': 0, 'does_not_support': 0, 'inconclusive': 0, 'not_applicable': 48}, sci
          assert d['metadata'].get('empirical_firewall') == 'fail_closed_v2', d['metadata']
          print('Matrice stricte:', counts)
          print('Verdicts scientifiques:', sci)
          PY

      - name: Classer les données manquantes par tests potentiellement débloqués
        run: |
          python plateforme/campagne_maximale_reelle/prioriser_donnees_manquantes.py \
            --entree plateforme/campagne_maximale_reelle/resultats_empiriques/strict_683/results.json \
            --sortie-json plateforme/campagne_maximale_reelle/resultats_empiriques/strict_683/PRIORITES_ACQUISITION_DONNEES.json \
            --sortie-md plateforme/campagne_maximale_reelle/resultats_empiriques/strict_683/PRIORITES_ACQUISITION_DONNEES.md

      - name: Tester la couche de certification fail-closed
        run: python -m pytest -q plateforme/campagne_maximale_reelle/tests/test_certifications_specialisees.py

      - name: Certifier les verdicts scientifiques des campagnes spécialisées
        run: |
          python plateforme/campagne_maximale_reelle/certifier_resultats_specialises.py \
            --sortie plateforme/campagne_maximale_reelle/resultats_empiriques/strict_683/RESULTATS_SCIENTIFIQUES_CERTIFIES.json

      - name: Publier uniquement les audits et sorties strictes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-empirique-strict-${{ github.sha }}
          path: |
            plateforme/campagne_maximale_reelle/resultats_empiriques
            donnees_externes/donnees_reelles_2026_08_07/SOURCE_BUNDLE.json
          if-no-files-found: error
          retention-days: 30
