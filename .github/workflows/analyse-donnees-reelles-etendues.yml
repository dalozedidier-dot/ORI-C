name: Analyses ORI-C — données réelles étendues

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plateforme/campagne_maximale_reelle/data/antibiotic_fitness_real.csv'
      - 'plateforme/campagne_maximale_reelle/data/partition_experiments.csv'
      - 'plateforme/campagne_maximale_reelle/data/prebiotic_rna_evolution.csv'
      - 'plan_directeur/exploitation_donnees_reelles_2026_08_15/**'
      - '.github/workflows/analyse-donnees-reelles-etendues.yml'

permissions:
  contents: read

concurrency:
  group: analyse-donnees-reelles-etendues-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - name: Récupérer le dépôt et Git LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1

      - name: Finaliser Git LFS
        run: git lfs pull

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt

      - name: Installer les dépendances verrouillées
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt

      - name: Vérifier l'intégrité initiale
        run: |
          python verifier_dossier.py
          python scripts/verifier_fins_de_ligne.py

      - name: Conserver les résultats de référence
        run: |
          mkdir -p "$RUNNER_TEMP/reference"
          cp -R plan_directeur/exploitation_donnees_reelles_2026_08_15/resultats/. "$RUNNER_TEMP/reference/"

      - name: Réanalyser les données réelles
        run: python plan_directeur/exploitation_donnees_reelles_2026_08_15/analyser.py

      - name: Tester l'analyse
        run: python -m pytest -q plan_directeur/exploitation_donnees_reelles_2026_08_15/tests

      - name: Vérifier la reproductibilité des sorties
        run: |
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/reference" \
            --candidate plan_directeur/exploitation_donnees_reelles_2026_08_15/resultats

      - name: Confirmer les qualifications scientifiques
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("plan_directeur/exploitation_donnees_reelles_2026_08_15/resultats")
          for name in (
              "RESULTAT_FITNESS_ORIGINE.json",
              "RESULTAT_PARTITION_CARBONE.json",
              "RESULTAT_RNA_PAPASTAVROU.json",
          ):
              value = json.loads((root / name).read_text(encoding="utf-8"))
              q = value["qualification"]
              assert q["real_data"] is True
              assert q["synthetic_or_simulated_scientific_data"] is False
              assert q["section_XIV_credit"] is False
          print("Qualifications scientifiques vérifiées sur données réelles.")
          PY
