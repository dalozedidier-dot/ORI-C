name: Publication stable ORI-C

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0
      - name: Hydrater Git LFS
        run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Contrôles portables
        run: |
          python -m compileall -q .
          python verifier_dossier.py
          python scripts/valider_tout.py --strict-lfs
          python scripts/valider_publication_stable.py
          python scripts/valider_barriere_empirique.py
      - name: Socle, plateforme et matière
        run: |
          python -m pytest -q plateforme/source_corrigee/tests
          (cd 00_socle && python -m pytest -q)
          python -m pytest -q \
            01_branche_matiere/hypergraphe_transformations/tests \
            01_branche_matiere/hypergraphe_transformations/fermeture_stricte/tests
          python -m pytest -q 01_branche_matiere/inventaire_hierarchique/tests
          mkdir -p "$RUNNER_TEMP/calibrage-reference"
          cp -R 01_branche_matiere/hypergraphe_transformations/calibrage_v094/resultats \
            "$RUNNER_TEMP/calibrage-reference/"
          python 01_branche_matiere/hypergraphe_transformations/calibrage_v094/calibrage_relations.py
          python -m pytest -q 01_branche_matiere/hypergraphe_transformations/calibrage_v094/tests
          # Comparaison à tolérance numérique, comme dans ci.yml : un `git diff`
          # comparerait des octets et casserait au premier déplacement d'optimum.
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/calibrage-reference/resultats" \
            --candidate 01_branche_matiere/hypergraphe_transformations/calibrage_v094/resultats
      - name: Mémoire historique
        working-directory: 02_branche_systeme_solaire/couche_memoire_historique
        run: |
          PYTHONPATH="$PWD/src" python -m unittest discover -s tests
          PYTHONPATH="$PWD/src" python -m pytest -q tests/test_hysteresis_c3.py
      - name: Couche astronomique
        working-directory: 02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests
        run: PYTHONPATH="$PWD:$PWD/src" python -m pytest -q
      - name: Couche spin-orbite en environnement isolé
        run: |
          python -m venv "$RUNNER_TEMP/spin-venv"
          "$RUNNER_TEMP/spin-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/spin-venv/bin/python" -m pip install -r 02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests/requirements.science.lock.txt
          "$RUNNER_TEMP/spin-venv/bin/python" -m pytest -q 02_branche_systeme_solaire/couche_spin_orbite/tests
          mkdir -p "$RUNNER_TEMP/spin-candidate"
          "$RUNNER_TEMP/spin-venv/bin/python" 02_branche_systeme_solaire/couche_spin_orbite/run_spin_orbit.py --output-dir "$RUNNER_TEMP/spin-candidate"
          "$RUNNER_TEMP/spin-venv/bin/python" scripts/verifier_reproductibilite_spin_orbite.py \
            --reference 02_branche_systeme_solaire/couche_spin_orbite/resultats \
            --candidate "$RUNNER_TEMP/spin-candidate"

      - name: Formalismes externes légers
        run: |
          python -m pytest -q \
            methodologie_informationnelle/tests \
            methodologie_puissance/tests \
            01_branche_matiere/organisations_chimiques/tests \
            01_branche_matiere/hypergraphe_transformations/test_topologie_persistante.py \
            02_branche_systeme_solaire/couche_memoire_historique/exploratoire_causalite/tests \
            03_branche_vivant/ltee_replay_history/tests \
            comparaisons_externes/assembly_theory/tests
          python scripts/verifier_reproductibilite_formalismes.py
          python scripts/valider_registre_preuves.py

      - name: PCMCI+ exploratoire en environnement isolé
        run: |
          cp 02_branche_systeme_solaire/couche_memoire_historique/exploratoire_causalite/resultats/PCMCI_PLUS_RESULTAT.json "$RUNNER_TEMP/PCMCI_PLUS_REFERENCE.json"
          python -m venv "$RUNNER_TEMP/pcmci-venv"
          "$RUNNER_TEMP/pcmci-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pcmci-venv/bin/python" -m pip install \
            -r plateforme/source_corrigee/requirements-lock.txt \
            -r 02_branche_systeme_solaire/couche_memoire_historique/exploratoire_causalite/requirements-pcmci.lock.txt
          "$RUNNER_TEMP/pcmci-venv/bin/python" 02_branche_systeme_solaire/couche_memoire_historique/exploratoire_causalite/run_pcmci_plus.py
          "$RUNNER_TEMP/pcmci-venv/bin/python" scripts/verifier_pcmci_plus.py \
            --reference "$RUNNER_TEMP/PCMCI_PLUS_REFERENCE.json" \
            --candidate 02_branche_systeme_solaire/couche_memoire_historique/exploratoire_causalite/resultats/PCMCI_PLUS_RESULTAT.json
          cp "$RUNNER_TEMP/PCMCI_PLUS_REFERENCE.json" 02_branche_systeme_solaire/couche_memoire_historique/exploratoire_causalite/resultats/PCMCI_PLUS_RESULTAT.json
      - name: Campagne maximale et reproductibilité
        run: |
          cp -R plan_directeur/campagne_maximale_trois_branches/resultats "$RUNNER_TEMP/campagne-reference"
          python plan_directeur/campagne_maximale_trois_branches/run_all.py
          python -m pytest -q plan_directeur/campagne_maximale_trois_branches/tests
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/campagne-reference" \
            --candidate plan_directeur/campagne_maximale_trois_branches/resultats
      - name: Priorités v0.9.3
        run: |
          python plan_directeur/campagne_priorites_v093/run_all.py
          python -m pytest -q plan_directeur/campagne_priorites_v093/tests
          python -m pytest -q 01_branche_matiere/hypergraphe_transformations/fermeture_stricte/tests
          python -m pytest -q 02_branche_systeme_solaire/transfert_climatique_intermediaire/tests
          python -m pytest -q 02_branche_systeme_solaire/couche_memoire_historique/tests/test_hysteresis_c3.py
          python -m pytest -q 03_branche_vivant/benchmark_externe_card2019/tests
          python -m pytest -q 03_branche_vivant/programme_prebiotique/tests
      - name: Restaurer exactement l’état du tag après les recalculs
        run: |
          git restore --worktree -- .
          git clean -fd

      - name: Finaliser le manifeste de la couche mémoire
        working-directory: 02_branche_systeme_solaire/couche_memoire_historique
        run: |
          export PYTHONPATH="$PWD/src"
          python -m oric_memory_tests.cli --root "$PWD" manifest
          python -m oric_memory_tests.cli --root "$PWD" verify-manifest
      - name: Reconstruire le manifeste de la revue systématique
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('plan_directeur/revue_systematique')
          rows=[]
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256'):
              rel=path.relative_to(root).as_posix()
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          (root/'MANIFEST.sha256').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          print(f"revue systématique: {len(rows)} entrées")
          PY
      - name: Valider les registres de publication
        run: |
          python scripts/construire_registre_preuves.py
          python scripts/valider_registre_preuves.py
          python scripts/valider_publication_stable.py
      - name: Reconstruire le manifeste racine en dernier
        run: |
          python build_manifest.py build
          python verifier_dossier.py
          python scripts/controle_avant_push.py
      - name: Construire l'archive canonique
        run: python scripts/construire_archive_canonique.py --output-dir dist --skip-tests
      - name: Déterminer les fichiers de publication
        run: |
          echo "ARCHIVE=$(find dist -maxdepth 1 -type f -name '*.zip' | head -1)" >> "$GITHUB_ENV"
          echo "CHECKSUM=$(find dist -maxdepth 1 -type f -name '*.sha256' | head -1)" >> "$GITHUB_ENV"
      - name: Conserver l'archive de la construction
        uses: actions/upload-artifact@v6
        with:
          name: ORI-C-${{ github.ref_name }}-canonique
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error
          retention-days: 90
      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          test -f "$NOTES_FILE"
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$CHECKSUM" \
            --title "ORI-C $GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            --verify-tag
