name: Analyses Système solaire ORI-C

on:
  workflow_dispatch:
    inputs:
      profondeur:
        description: Calcul astronomique à exécuter
        required: true
        default: rapide
        type: choice
        options:
          - rapide
          - complete
  workflow_call:
    inputs:
      profondeur:
        description: Calcul astronomique à exécuter
        required: false
        default: complete
        type: string
  push:
    branches: [main]
    paths:
      - '02_branche_systeme_solaire/couche_astronomique/**'
      - '02_branche_systeme_solaire/couche_memoire_historique/**'
      - '02_branche_systeme_solaire/couche_spin_orbite/**'
      - 'scripts/verifier_reproductibilite_spin_orbite.py'
      - '.github/workflows/analyse-systeme-solaire.yml'

permissions:
  contents: read

concurrency:
  group: analyse-systeme-solaire-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  memoire:
    name: Couche mémoire historique
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      MEMORY: ${{ github.workspace }}/02_branche_systeme_solaire/couche_memoire_historique

    steps:
      - name: Récupérer le dépôt et Git LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1

      - name: Finaliser Git LFS
        run: git lfs pull

      - name: Préparer l'espace temporaire mémoire
        run: |
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/oric-memoire" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/matplotlib" "$RUNNER_TEMP/oric-memoire/logs" "$RUNNER_TEMP/oric-memoire/resultats"

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt

      - name: Mettre de côté les résultats versionnés comme référence
        run: |
          mkdir -p "$RUNNER_TEMP/memoire-reference"
          cp -R "$MEMORY/results" "$RUNNER_TEMP/memoire-reference/" 2>/dev/null || true
          cp -R "$MEMORY/results_stress" "$RUNNER_TEMP/memoire-reference/" 2>/dev/null || true

      - name: Tester et recalculer la couche mémoire
        run: |
          mkdir -p "$OUT/logs"
          cd "$MEMORY"
          export PYTHONPATH="$MEMORY/src"
          python -m unittest discover -s tests \
            | tee "$OUT/logs/tests_memoire.log"
          bash scripts/run_all.sh \
            | tee "$OUT/logs/campagne_principale.log"

      - name: Rejouer le contrôle négatif réel des surrogats
        run: |
          python scripts/controle_negatif_reel_surrogats.py --surrogats 200             | tee "$OUT/logs/controle_negatif_surrogats.log"

      - name: Finaliser et vérifier le manifeste mémoire
        run: |
          cd "$MEMORY"
          export PYTHONPATH="$MEMORY/src"
          python -m oric_memory_tests.cli --root "$MEMORY" manifest
          python -m oric_memory_tests.cli --root "$MEMORY" verify-manifest

      # Le contrôle de reproductibilité se fait avec la même tolérance numérique
      # que les workflows ci.yml, analyse-maximale-trois-branches.yml et
      # release.yml. Un `git diff` brut comparait des octets et signalait des
      # écarts d'optimiseur de l'ordre de 1e-9 entre versions mineures de scipy,
      # ce qui produisait un artefact de plusieurs mégaoctets sans qu'aucun
      # verdict ne change. La liste des fichiers touchés reste jointe pour la
      # traçabilité, mais elle ne sert plus de critère.
      # Tolérance relative portée de 1e-8 à 1e-5 le 8 août 2026. Les sorties de
      # `mpt/predictions.csv` viennent d'un optimiseur scipy : elles bougent d'une
      # version mineure à l'autre sans qu'aucun verdict ne change. Distribution
      # mesurée sur le run échoué, 300 valeurs environ : médiane 1,7e-08,
      # maximum relevé 1,7e-07. Le seuil laisse presque deux ordres de grandeur
      # au-dessus du maximum observé, et reste quatre ordres sous tout changement
      # scientifique réel : une prédiction qui bougerait vraiment se déplacerait
      # de plusieurs pour cent, pas de 0,001 %.
      # La tolérance absolue locale vaut 2e-10 pour les valeurs proches de zéro.
      # Elle absorbe l'écart maximal observé de 1,068e-10 sans modifier la
      # tolérance par défaut du vérificateur ni les autres workflows.
      # Ne pas relâcher davantage sans remesurer la distribution.
      - name: Contrôler la reproductibilité numérique de la couche mémoire
        run: |
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/memoire-reference/results" \
            --candidate "$MEMORY/results" \
            --relative-tolerance 1e-5 \
            --absolute-tolerance 2e-10 \
            | tee "$OUT/reproductibilite_memoire.log"

      - name: Rassembler les résultats mémoire
        if: always()
        run: |
          mkdir -p "$OUT/resultats"
          cp -R "$MEMORY/results" "$OUT/resultats/" 2>/dev/null || true
          cp "$MEMORY/RAPPORT_CORRIGE.md" "$OUT/resultats/" 2>/dev/null || true
          git diff --stat -- 02_branche_systeme_solaire/couche_memoire_historique \
            > "$OUT/regeneration_memoire.txt" || true
          python -m pip freeze > "$OUT/pip-freeze.txt"

      - name: Publier les résultats mémoire
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analyse-memoire-${{ github.sha }}
          path: ${{ runner.temp }}/oric-memoire
          if-no-files-found: error
          retention-days: 30

  astronomie:
    name: Couche astronomique N-corps
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      ASTRO_ROOT: ${{ github.workspace }}/02_branche_systeme_solaire/couche_astronomique
      ASTRO_CODE: ${{ github.workspace }}/02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests

    steps:
      - name: Récupérer le dépôt et Git LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1

      - name: Finaliser Git LFS
        run: git lfs pull

      - name: Préparer l'espace temporaire astronomie
        run: |
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/oric-astronomie" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/matplotlib" "$RUNNER_TEMP/oric-astronomie/logs" "$RUNNER_TEMP/oric-astronomie/resultats"

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests/requirements.science.lock.txt

      - name: Installer l'environnement scientifique figé
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$ASTRO_CODE/requirements.science.lock.txt"
          python -m pip install --no-build-isolation --no-deps -e "$ASTRO_CODE"

      - name: Vérifier le paquet astronomique
        run: |
          mkdir -p "$OUT/logs"
          python "$ASTRO_ROOT/scripts/verifier_paquet.py" \
            | tee "$OUT/logs/verifier_paquet.log"

      - name: Exécuter les tests et le contrôle N-corps rapide
        working-directory: 02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests
        run: |
          python -m pytest -q | tee "$OUT/logs/tests_astronomie.log"
          python -m oric_solar_history doctor \
            | tee "$OUT/logs/doctor.log"
          python -m oric_solar_history run \
            --config configs/rebound_quickcheck.yaml \
            --overwrite \
            | tee "$OUT/logs/rebound_quickcheck.log"

      - name: Refaire les 25 calculs astronomiques
        if: ${{ inputs.profondeur == 'complete' }}
        working-directory: 02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests
        run: |
          python scripts/run_real_science_suite.py \
            --config configs/real_science_max.yaml \
            --overwrite \
            | tee "$OUT/logs/real_science_max.log"
          python scripts/analyze_real_science_suite.py \
            --config configs/real_science_max.yaml \
            | tee "$OUT/logs/analyse_real_science_max.log"

      - name: Rassembler les résultats astronomiques
        if: always()
        run: |
          mkdir -p "$OUT/resultats"
          cp -R "$ASTRO_CODE/runs" "$OUT/resultats/" 2>/dev/null || true
          cp -R "$ASTRO_ROOT/resultats" "$OUT/resultats/" 2>/dev/null || true
          cp -R "$ASTRO_ROOT/analyse_recalculee" "$OUT/resultats/" 2>/dev/null || true
          cp "$ASTRO_ROOT/REPRODUCTION.md" "$OUT/resultats/" 2>/dev/null || true
          git diff --binary -- 02_branche_systeme_solaire/couche_astronomique \
            > "$OUT/regeneration_astronomie.diff" || true
          python -m pip freeze > "$OUT/pip-freeze.txt"

      - name: Publier les résultats astronomiques
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analyse-astronomique-${{ github.sha }}
          path: ${{ runner.temp }}/oric-astronomie
          if-no-files-found: error
          retention-days: 30

  spin_orbite:
    name: Couche spin-orbite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SPIN: ${{ github.workspace }}/02_branche_systeme_solaire/couche_spin_orbite
      ASTRO_CODE: ${{ github.workspace }}/02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests

    steps:
      - name: Récupérer le dépôt et Git LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1

      - name: Finaliser Git LFS
        run: git lfs pull

      - name: Préparer l'espace temporaire spin-orbite
        run: |
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib-spin" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/oric-spin-orbite" >> "$GITHUB_ENV"
          echo "CANDIDATE=$RUNNER_TEMP/spin-candidate" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/matplotlib-spin" "$RUNNER_TEMP/oric-spin-orbite/logs" "$RUNNER_TEMP/spin-candidate"

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests/requirements.science.lock.txt

      - name: Installer l'environnement scientifique figé
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$ASTRO_CODE/requirements.science.lock.txt"

      - name: Tester la dynamique du spin
        run: |
          cd "$SPIN"
          python -m pytest -q tests \
            | tee "$OUT/logs/tests_spin_orbite.log"

      - name: Recalculer spin, obliquité et insolation
        run: |
          python "$SPIN/run_spin_orbit.py" \
            --output-dir "$CANDIDATE" \
            | tee "$OUT/logs/calcul_spin_orbite.log"

      - name: Vérifier le manifeste des résultats recalculés
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, os.environ["SPIN"])
          from spin_orbit import verify_results_manifest
          verify_results_manifest(Path(os.environ["CANDIDATE"]))
          print("Manifeste spin-orbite recalculé valide")
          PY

      - name: Contrôler la reproductibilité numérique spin-orbite
        run: |
          # Le témoin avec Lune est comparé point par point sur 20 Ma.
          # L'ablation lunaire, chaotiquement sensible à long terme, est
          # comparée point par point jusqu'à 2 Ma puis par agrégats 20 Ma.
          # La viabilité est recalculée par le workflow des formalismes externes.
          python scripts/verifier_reproductibilite_spin_orbite.py \
            --reference "$SPIN/resultats" \
            --candidate "$CANDIDATE" \
            | tee "$OUT/logs/reproductibilite_spin_orbite.log"

      - name: Rassembler les résultats spin-orbite
        if: always()
        run: |
          mkdir -p "$OUT/resultats"
          cp -R "$CANDIDATE"/. "$OUT/resultats/" 2>/dev/null || true
          cp "$SPIN/README.md" "$OUT/" 2>/dev/null || true
          cp "$SPIN/PROVENANCE.md" "$OUT/" 2>/dev/null || true
          cp "$SPIN/PROTOCOLE_REPLICATION.md" "$OUT/" 2>/dev/null || true
          python -m pip freeze > "$OUT/pip-freeze.txt"

      - name: Publier les résultats spin-orbite
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analyse-spin-orbite-${{ github.sha }}
          path: ${{ runner.temp }}/oric-spin-orbite
          if-no-files-found: error
          retention-days: 30

