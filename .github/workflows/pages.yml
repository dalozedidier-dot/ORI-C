name: GitHub Pages ORI-C

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Écrire les métadonnées du déploiement
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          sha = os.environ['BUILD_SHA']
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          payload = {
              'commit': sha,
              'short': sha[:8],
              'built_at': now.isoformat().replace('+00:00', 'Z'),
              'built_at_display': now.strftime('%d/%m/%Y à %H:%M UTC'),
          }
          Path('site/build.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Préparer le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
