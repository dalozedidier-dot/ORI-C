name: Recherche suivante ORI-C

on:
  workflow_dispatch:
    inputs:
      telecharger_donnees:
        description: Télécharger les jeux externes requis
        required: true
        default: true
        type: boolean
      retelcharger:
        description: Forcer un nouveau téléchargement
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Hydrater Git LFS
        run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Acquérir les données externes
        if: ${{ inputs.telecharger_donnees }}
        continue-on-error: true
        run: |
          if [ "${{ inputs.retelcharger }}" = "true" ]; then
            python plan_directeur/campagne_recherche_suivante/fetch_external_data.py --force
          else
            python plan_directeur/campagne_recherche_suivante/fetch_external_data.py
          fi
      - name: Exécuter les nouveaux tests
        run: |
          python plan_directeur/campagne_recherche_suivante/run_all.py
          python -m pytest -q             01_branche_matiere/tests_causaux/tests             02_branche_systeme_solaire/tests_suivants/tests             03_branche_vivant/lignees_vesicules/tests             03_branche_vivant/benchmark_histoire_antibiotique_2026/tests             plan_directeur/campagne_recherche_suivante/tests
          python scripts/valider_recherche_suivante.py
      - name: Vérifier les jeux externes requis
        if: ${{ always() && inputs.telecharger_donnees }}
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path("donnees_externes/ACQUISITION_REPORT.json")
          if not report_path.exists():
              print("Rapport d'acquisition absent.")
              raise SystemExit(1)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          blocking = [
              item for item in report
              if item.get("required")
              and item.get("status") in {"download_failed", "incomplete"}
          ]
          if blocking:
              print("Jeux externes requis indisponibles ou incomplets :")
              for item in blocking:
                  print(f"- {item.get('id')}: {item.get('status')} {item.get('error', '')}")
              raise SystemExit(1)
          print("Tous les jeux externes requis sont disponibles.")
          PY
      - name: Publier les rapports et la provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recherche-suivante-${{ github.sha }}
          path: |
            plan_directeur/campagne_recherche_suivante/resultats
            01_branche_matiere/tests_causaux/resultats
            02_branche_systeme_solaire/tests_suivants/resultats
            03_branche_vivant/lignees_vesicules/resultats
            03_branche_vivant/benchmark_histoire_antibiotique_2026/resultats
            donnees_externes/**/SOURCE.json
            donnees_externes/ACQUISITION_REPORT.json
          if-no-files-found: warn
          retention-days: 30
