name: Recherche suivante ORI-C

on:
  workflow_dispatch:
    inputs:
      telecharger_donnees:
        description: Rafraîchir les jeux externes depuis les fournisseurs
        required: true
        default: false
        type: boolean
      retelcharger:
        description: Forcer un nouveau téléchargement
        required: true
        default: false
        type: boolean
      exiger_donnees_externes:
        description: Échouer si un jeu requis intégré est absent ou invalide
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DRYAD_API_TOKEN: ${{ secrets.DRYAD_API_TOKEN }}
      DRYAD_API_CLIENT_ID: ${{ secrets.DRYAD_API_CLIENT_ID }}
      DRYAD_API_CLIENT_SECRET: ${{ secrets.DRYAD_API_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Hydrater Git LFS
        run: git lfs pull

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt

      - name: Tester le client d'acquisition
        run: python -m pytest -q plan_directeur/campagne_recherche_suivante/tests/test_external_acquisition.py

      - name: Contrôler les données externes intégrées
        shell: bash
        run: |
          args=(--offline)
          if [ "${{ inputs.telecharger_donnees }}" = "true" ]; then
            args=()
            if [ "${{ inputs.retelcharger }}" = "true" ]; then
              args+=(--force)
            fi
          fi
          if [ "${{ inputs.exiger_donnees_externes }}" != "true" ]; then
            args+=(--allow-unavailable-required)
          fi
          python plan_directeur/campagne_recherche_suivante/fetch_external_data.py "${args[@]}"

      - name: Exécuter les nouveaux tests
        run: |
          python plan_directeur/campagne_recherche_suivante/run_all.py
          python -m pytest -q \
            01_branche_matiere/tests_causaux/tests \
            02_branche_systeme_solaire/tests_suivants/tests \
            03_branche_vivant/lignees_vesicules/tests \
            03_branche_vivant/benchmark_histoire_antibiotique_2026/tests \
            plan_directeur/campagne_recherche_suivante/tests
          python scripts/valider_recherche_suivante.py

      - name: Résumer la disponibilité des jeux externes
        if: ${{ always() }}
        env:
          STRICT_EXTERNAL_DATA: ${{ inputs.exiger_donnees_externes }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          strict = os.environ.get("STRICT_EXTERNAL_DATA", "false").lower() == "true"
          report_path = Path("donnees_externes/ACQUISITION_REPORT.json")
          if not report_path.exists():
              print("Rapport d'acquisition absent.")
              raise SystemExit(1 if strict else 0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          unavailable = [
              item for item in report
              if item.get("required") and item.get("status") != "ok"
          ]
          if not unavailable:
              print("Tous les jeux externes requis sont disponibles.")
              raise SystemExit(0)

          print("Jeux externes requis absents ou invalides :")
          for item in unavailable:
              print(f"- {item.get('id')}: {item.get('status')}")
              for attempt in item.get("attempt_errors", []):
                  print(
                      "  "
                      f"{attempt.get('method', 'acquisition')}: "
                      f"{attempt.get('error', '')} "
                      f"{attempt.get('url', '')}"
                  )
          print(
              "Les analyses dépendantes restent explicitement en attente. "
              "Le reste de la campagne et ses contrôles ne sont pas invalidés "
              "par un refus HTTP du fournisseur externe."
          )
          raise SystemExit(1 if strict else 0)
          PY

      - name: Publier les rapports et la provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recherche-suivante-${{ github.sha }}
          path: |
            plan_directeur/campagne_recherche_suivante/resultats
            01_branche_matiere/tests_causaux/resultats
            02_branche_systeme_solaire/tests_suivants/resultats
            03_branche_vivant/lignees_vesicules/resultats
            03_branche_vivant/benchmark_histoire_antibiotique_2026/resultats
            donnees_externes/**/SOURCE.json
            donnees_externes/ACQUISITION_REPORT.json
          if-no-files-found: warn
          retention-days: 30
