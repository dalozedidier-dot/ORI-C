name: Recherche suivante ORI-C — données réelles incluses

on:
  workflow_dispatch:
    inputs:
      mode_donnees:
        description: Action sur les 3 jeux réels ; leur test est toujours exécuté
        required: true
        default: Tester les données intégrées
        type: choice
        options:
          - Tester les données intégrées
          - Rafraîchir puis tester
          - Retélécharger puis tester
permissions:
  contents: read

jobs:
  recherche:
    name: Tester les données réelles et la campagne
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DRYAD_API_TOKEN: ${{ secrets.DRYAD_API_TOKEN }}
      DRYAD_API_CLIENT_ID: ${{ secrets.DRYAD_API_CLIENT_ID }}
      DRYAD_API_CLIENT_SECRET: ${{ secrets.DRYAD_API_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Hydrater Git LFS
        run: git lfs pull

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt

      - name: Tester le client d'acquisition
        run: python -m pytest -q plan_directeur/campagne_recherche_suivante/tests/test_external_acquisition.py

      - name: Préparer et contrôler les 3 jeux de données réelles
        shell: bash
        run: |
          case "${{ inputs.mode_donnees }}" in
            "Tester les données intégrées")
              args=(--offline)
              ;;
            "Rafraîchir puis tester")
              args=()
              ;;
            "Retélécharger puis tester")
              args=(--force)
              ;;
            *)
              echo "Mode de données inconnu : ${{ inputs.mode_donnees }}" >&2
              exit 2
              ;;
          esac
          python plan_directeur/campagne_recherche_suivante/fetch_external_data.py "${args[@]}"

      - name: Analyser les nouvelles données Dryad et NOAA avec toute la campagne
        run: python plan_directeur/campagne_recherche_suivante/run_all.py

      - name: Tester explicitement les résultats produits sur les 3 jeux réels
        run: python scripts/valider_donnees_reelles.py

      - name: Exécuter les tests logiciels et valider la campagne
        run: |
          python -m pytest -q \
            01_branche_matiere/tests_causaux/tests \
            02_branche_systeme_solaire/tests_suivants/tests \
            03_branche_vivant/lignees_vesicules/tests \
            03_branche_vivant/benchmark_histoire_antibiotique_2026/tests \
            03_branche_vivant/benchmark_externe_santos_lopez_2021/tests \
            plan_directeur/campagne_recherche_suivante/tests
          python scripts/valider_recherche_suivante.py

      - name: Résumer la disponibilité des jeux externes
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("donnees_externes/ACQUISITION_REPORT.json")
          if not report_path.exists():
              print("Rapport d'acquisition absent.")
              raise SystemExit(1)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          unavailable = [item for item in report if item.get("status") != "ok"]
          if not unavailable:
              print("Les trois jeux externes sont disponibles et ont été testés.")
              raise SystemExit(0)

          print("Jeux externes absents ou invalides :")
          for item in unavailable:
              print(f"- {item.get('id')}: {item.get('status')}")
              for attempt in item.get("attempt_errors", []):
                  print(
                      "  "
                      f"{attempt.get('method', 'acquisition')}: "
                      f"{attempt.get('error', '')} "
                      f"{attempt.get('url', '')}"
                  )
          raise SystemExit(1)
          PY

      - name: Publier les tests des données réelles, les rapports et la provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recherche-suivante-${{ github.sha }}
          path: |
            plan_directeur/campagne_recherche_suivante/resultats
            01_branche_matiere/tests_causaux/resultats
            02_branche_systeme_solaire/tests_suivants/resultats
            03_branche_vivant/lignees_vesicules/resultats
            03_branche_vivant/benchmark_histoire_antibiotique_2026/resultats
            03_branche_vivant/benchmark_externe_santos_lopez_2021/resultats
            donnees_externes/**/SOURCE.json
            donnees_externes/ACQUISITION_REPORT.json
          if-no-files-found: error
          retention-days: 30
