name: Données réelles vivant 2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'donnees_externes/lamrabet_2019/**'
      - 'donnees_externes/petrungaro_2026/**'
      - 'donnees_externes/nader_vesicules_2026/**'
      - 'donnees_externes/card_2019_complet/**'
      - '03_branche_vivant/benchmark_lamrabet_2019/**'
      - '03_branche_vivant/benchmark_petrungaro_2026/**'
      - '03_branche_vivant/lignees_vesicules/nader_2026/**'
      - '03_branche_vivant/benchmark_externe_card2019/**'
      - '03_branche_vivant/synthese_donnees_reelles_2026/**'
      - '.github/workflows/donnees-reelles-vivant-2026.yml'

permissions:
  contents: read

concurrency:
  group: donnees-reelles-vivant-2026-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  analyses-reelles:
    name: Réextraire et vérifier les données réelles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Charger seulement les archives biologiques nécessaires
        run: >-
          git lfs pull
          --include="donnees_externes/petrungaro_2026/**,donnees_externes/card_2019_complet/**"
          --exclude=""

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt

      - name: Installer les dépendances verrouillées
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt

      - name: Conserver les résultats de référence
        run: |
          mkdir -p "$RUNNER_TEMP/reference"
          cp -R 03_branche_vivant/benchmark_lamrabet_2019/resultats "$RUNNER_TEMP/reference/lamrabet"
          cp -R 03_branche_vivant/benchmark_petrungaro_2026/resultats "$RUNNER_TEMP/reference/petrungaro"
          cp -R 03_branche_vivant/lignees_vesicules/nader_2026/resultats "$RUNNER_TEMP/reference/nader"
          cp -R 03_branche_vivant/benchmark_externe_card2019/resultats "$RUNNER_TEMP/reference/card"
          mkdir -p "$RUNNER_TEMP/reference/synthese"
          cp 03_branche_vivant/synthese_donnees_reelles_2026/COMPARAISON_ETUDES_REELLES.csv "$RUNNER_TEMP/reference/synthese/"
          cp 03_branche_vivant/synthese_donnees_reelles_2026/SYNTHESE.json "$RUNNER_TEMP/reference/synthese/"

      - name: Vérifier l'intégrité initiale
        run: |
          python verifier_dossier.py --allow-lfs-pointers
          python scripts/verifier_fins_de_ligne.py

      - name: Réextraire et analyser
        run: |
          python 03_branche_vivant/benchmark_externe_card2019/auditer_archive_complete.py
          python 03_branche_vivant/benchmark_lamrabet_2019/analyser.py
          python 03_branche_vivant/benchmark_petrungaro_2026/analyser.py
          python 03_branche_vivant/benchmark_petrungaro_2026/approfondir_nit.py
          python 03_branche_vivant/lignees_vesicules/nader_2026/analyser.py
          python 03_branche_vivant/synthese_donnees_reelles_2026/construire.py

      - name: Tester les unités, champs et qualifications
        run: python -m pytest -q 03_branche_vivant/synthese_donnees_reelles_2026/test_analyses.py

      - name: Vérifier la reproductibilité des sorties
        run: |
          python scripts/verifier_reproductibilite_resultats.py --reference "$RUNNER_TEMP/reference/lamrabet" --candidate 03_branche_vivant/benchmark_lamrabet_2019/resultats
          python scripts/verifier_reproductibilite_resultats.py --reference "$RUNNER_TEMP/reference/petrungaro" --candidate 03_branche_vivant/benchmark_petrungaro_2026/resultats
          python scripts/verifier_reproductibilite_resultats.py --reference "$RUNNER_TEMP/reference/nader" --candidate 03_branche_vivant/lignees_vesicules/nader_2026/resultats
          python scripts/verifier_reproductibilite_resultats.py --reference "$RUNNER_TEMP/reference/card" --candidate 03_branche_vivant/benchmark_externe_card2019/resultats
          mkdir -p "$RUNNER_TEMP/candidate-synthese"
          cp 03_branche_vivant/synthese_donnees_reelles_2026/COMPARAISON_ETUDES_REELLES.csv "$RUNNER_TEMP/candidate-synthese/"
          cp 03_branche_vivant/synthese_donnees_reelles_2026/SYNTHESE.json "$RUNNER_TEMP/candidate-synthese/"
          python scripts/verifier_reproductibilite_resultats.py --reference "$RUNNER_TEMP/reference/synthese" --candidate "$RUNNER_TEMP/candidate-synthese"

      - name: Confirmer l'absence de données scientifiques synthétiques
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('03_branche_vivant/benchmark_lamrabet_2019/resultats/RESULTAT_LAMRABET_2019.json'),
              Path('03_branche_vivant/benchmark_petrungaro_2026/resultats/RESULTAT_PETRUNGARO_2026.json'),
              Path('03_branche_vivant/lignees_vesicules/nader_2026/resultats/RESULTAT_NADER_2026.json'),
              Path('03_branche_vivant/benchmark_externe_card2019/resultats/AUDIT_ARCHIVE_COMPLETE_CARD_2019.json'),
          ]
          for path in paths:
              value = json.loads(path.read_text(encoding='utf-8'))
              qualification = value['qualification']
              assert qualification['real_data'] is True
              assert qualification['synthetic_or_simulated_scientific_data'] is False
          print('Toutes les analyses scientifiques utilisent uniquement les données réelles publiées.')
          PY
