name: Finaliser correctif HMR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-hmr-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt

      - name: Installer dépendances
        run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt

      - name: Finaliser vues et retirer fichiers temporaires
        run: |
          rm -f APPLIQUER_CORRECTIF_HMR.py
          python scripts/construire_verrous_actifs.py
          python scripts/evaluer_readiness_verrous.py
          rm -f .github/workflows/finalize-hmr-ci.yml

      - name: Reconstruire manifeste
        run: |
          python build_manifest.py build
          python build_manifest.py verify

      - name: Vérifier déterminisme
        run: |
          python scripts/construire_verrous_actifs.py
          python scripts/evaluer_readiness_verrous.py
          python build_manifest.py verify

      - name: Tests HMR et campagne centrale
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python -m pytest -q plan_directeur/campagne_centrale_2026_08_11/tests 03_branche_vivant/lignees_vesicules/tests/test_pacc_prospectif_gate.py
          python scripts/valider_tout.py
          python verifier_dossier.py

      - name: Commit final propre
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Aucun changement à committer.'
          else
            git commit -m 'Finalize HMR update and manifests'
            git push origin HEAD:main
          fi
