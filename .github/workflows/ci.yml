name: validation ORI-C

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Finaliser le téléchargement Git LFS
        run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Compiler tous les modules Python
        run: python -m compileall -q .
      - name: Vérifier l'intégrité canonique et Git LFS
        run: python verifier_dossier.py
      - name: Valider les suites canoniques
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python scripts/valider_tout.py --strict-lfs
      - name: Tester la campagne maximale sur les trois branches
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q plan_directeur/campagne_maximale_trois_branches/tests
      - name: Vérifier la reproductibilité de la campagne maximale
        if: matrix.python-version == '3.12'
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          cp -R plan_directeur/campagne_maximale_trois_branches/resultats             "$RUNNER_TEMP/campagne-reference"
          python plan_directeur/campagne_maximale_trois_branches/run_all.py
          python scripts/verifier_reproductibilite_resultats.py             --reference "$RUNNER_TEMP/campagne-reference"             --candidate plan_directeur/campagne_maximale_trois_branches/resultats
