name: Validation ORI-C

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'site/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'site/**'

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  portable:
    name: Contrôles portables Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Compiler et vérifier l'intégrité
        run: |
          python -m compileall -q .
          python verifier_dossier.py --allow-lfs-pointers
          python scripts/verifier_fins_de_ligne.py
          python scripts/controle_avant_push.py --allow-lfs-pointers
          python scripts/valider_tout.py
      - name: Exécuter les suites portables du socle et de la matière
        run: |
          python -m pytest -q plateforme/source_corrigee/tests
          python -m pytest -q methodologie_puissance/tests
          (cd 00_socle && python -m pytest -q)
          python -m pytest -q \
            01_branche_matiere/hypergraphe_transformations/tests \
            01_branche_matiere/hypergraphe_transformations/fermeture_stricte/tests
          python -m pytest -q 01_branche_matiere/inventaire_hierarchique/tests
          python -m pytest -q 01_branche_matiere/memoire_materielle_reelle/experiences_appariees/tests
      # Les sorties régénérées sont comparées avec la même tolérance numérique
      # que partout ailleurs. Un `git diff` brut compare des octets : il casse
      # dès qu'une version mineure de scipy déplace un optimum de 1e-9, sans
      # qu'aucun résultat n'ait changé.
      - name: Calibrer l architecture matérielle v0.9.4
        run: |
          mkdir -p "$RUNNER_TEMP/calibrage-reference"
          cp -R 01_branche_matiere/hypergraphe_transformations/calibrage_v094/resultats \
            "$RUNNER_TEMP/calibrage-reference/"
          python 01_branche_matiere/hypergraphe_transformations/calibrage_v094/calibrage_relations.py
          python -m pytest -q 01_branche_matiere/hypergraphe_transformations/calibrage_v094/tests
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/calibrage-reference/resultats" \
            --candidate 01_branche_matiere/hypergraphe_transformations/calibrage_v094/resultats
      - name: Exécuter les priorités v0.9.3
        if: github.event_name == 'workflow_dispatch'
        run: |
          git lfs pull \
            --include="02_branche_systeme_solaire/couche_astronomique/resultats/real_science_max/baseline_20myr_dt10/**" \
            --exclude=""
          python plan_directeur/campagne_priorites_v093/run_all.py
          python -m pytest -q plan_directeur/campagne_priorites_v093/tests
          python -m pytest -q 01_branche_matiere/hypergraphe_transformations/fermeture_stricte/tests
          python -m pytest -q 02_branche_systeme_solaire/transfert_climatique_intermediaire/tests
          python -m pytest -q 02_branche_systeme_solaire/couche_memoire_historique/tests/test_hysteresis_c3.py
          python -m pytest -q 03_branche_vivant/benchmark_externe_card2019/tests
          python -m pytest -q 03_branche_vivant/programme_prebiotique/tests
      - name: Exécuter et contrôler la recherche suivante
        run: |
          for dossier in \
            plan_directeur/campagne_recherche_suivante/resultats \
            01_branche_matiere/tests_causaux/resultats \
            02_branche_systeme_solaire/tests_suivants/resultats \
            03_branche_vivant/lignees_vesicules/resultats \
            03_branche_vivant/benchmark_histoire_antibiotique_2026/resultats \
            03_branche_vivant/benchmark_externe_santos_lopez_2021/resultats ; do
            cible="$RUNNER_TEMP/recherche-reference/$dossier"
            mkdir -p "$cible"
            cp -R "$dossier/." "$cible/"
          done
          python plan_directeur/campagne_recherche_suivante/run_all.py
          python -m pytest -q \
            01_branche_matiere/tests_causaux/tests \
            02_branche_systeme_solaire/tests_suivants/tests \
            03_branche_vivant/lignees_vesicules/tests \
            03_branche_vivant/benchmark_histoire_antibiotique_2026/tests \
            03_branche_vivant/benchmark_externe_santos_lopez_2021/tests \
            plan_directeur/campagne_recherche_suivante/tests
          python scripts/valider_recherche_suivante.py
          for dossier in \
            plan_directeur/campagne_recherche_suivante/resultats \
            01_branche_matiere/tests_causaux/resultats \
            02_branche_systeme_solaire/tests_suivants/resultats \
            03_branche_vivant/lignees_vesicules/resultats \
            03_branche_vivant/benchmark_histoire_antibiotique_2026/resultats \
            03_branche_vivant/benchmark_externe_santos_lopez_2021/resultats ; do
            python scripts/verifier_reproductibilite_resultats.py \
              --reference "$RUNNER_TEMP/recherche-reference/$dossier" \
              --candidate "$dossier"
          done
      - name: Vérifier la publication stable
        run: python scripts/valider_publication_stable.py


  preuves-phares:
    name: Démonstration, registre et contrôle négatif
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Recalculer les trois résultats phares et produire le rapport HTML
        run: python scripts/demo_minimale_html.py --output "$RUNNER_TEMP/demo-minimale.html"
      - name: Valider le registre de preuves et les chiffres canoniques
        run: python scripts/valider_registre_preuves.py
      - name: Valider le noyau externe et les portes prospectives
        run: |
          python scripts/valider_core_results.py
          python scripts/verifier_dataset_vivant_aveugle.py
          python 01_branche_matiere/hypergraphe_transformations/fermeture_stricte/valider_hc02_extension.py
          python 01_branche_matiere/memoire_materielle_reelle/experiences_appariees/valider_pacc_mag_design.py
          python 01_branche_matiere/memoire_materielle_reelle/experiences_appariees/valider_gate_mag_pair_001.py
          python 03_branche_vivant/lignees_vesicules/valider_gate_ves_pacc_int_01.py
          python -m pytest -q 01_branche_matiere/hypergraphe_transformations/fermeture_stricte/tests/test_verrou_matiere.py
          python -m pytest -q 01_branche_matiere/memoire_materielle_reelle/experiences_appariees/tests
          python -m pytest -q 03_branche_vivant/lignees_vesicules/tests/test_ves_execution_gate.py
      - name: Vérifier les vues dérivées du noyau et des verrous
        run: |
          python scripts/construire_core_results.py
          python scripts/construire_verrous_actifs.py
          python scripts/evaluer_readiness_verrous.py
          git diff --exit-code -- CORE_RESULTS.md site/core.html plan_directeur/VERROUS_ACTIFS.json plan_directeur/READINESS_VERROUS.json
      - name: Valider les notebooks d’entrée
        run: |
          python -m json.tool notebooks/ORI-C_demo_colab.ipynb > /dev/null
          python -m json.tool notebooks/branche_matiere_26Al.ipynb > /dev/null
          python -m json.tool notebooks/branche_systeme_solaire_interventions.ipynb > /dev/null
          python -m json.tool notebooks/branche_vivant_histoire.ipynb > /dev/null
      - name: Rejouer le contrôle négatif réel sans modifier le fichier versionné
        run: |
          python scripts/controle_negatif_reel_surrogats.py \
            --surrogats 200 \
            --sortie "$RUNNER_TEMP/controle-negatif-reel.json"
      - name: Vérifier la vue interactive dérivée
        run: |
          python scripts/construire_exploration_site.py
          git diff --exit-code -- site/data/exploration.json
      - name: Publier les artefacts de vérification
        uses: actions/upload-artifact@v6
        with:
          name: preuves-phares-${{ github.sha }}
          path: |
            ${{ runner.temp }}/demo-minimale.html
            ${{ runner.temp }}/controle-negatif-reel.json
          if-no-files-found: error
          retention-days: 30

  # Les seize autres tâches tournent sur ubuntu-latest. Deux défauts ne
  # pouvaient donc jamais y apparaître : des fins de ligne converties en CRLF
  # au clonage, qui font diverger les empreintes du manifeste, et du code qui
  # suppose une sortie UTF-8 alors que Windows utilise la page de code du
  # système. Cette tâche reste volontairement courte et n'exporte PAS
  # PYTHONUTF8 : c'est précisément l'absence de cette variable qui révèle le
  # second défaut.
  portabilite-windows:
    name: Portabilité Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Contrôler l'intégrité après un clonage Windows
        run: python verifier_dossier.py --allow-lfs-pointers
      - name: Contrôler que le manifeste correspond au contenu indexé
        run: python scripts/verifier_fins_de_ligne.py
      - name: Exécuter la suite du socle sans forcer l'encodage
        working-directory: 00_socle
        run: python -m pytest -q

  campagne_matiere:
    name: Campagne mémoire matérielle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Cette campagne est la seule suite de la CI générale qui ouvre les
      # archives de mémoire matérielle suivies par Git LFS.
      - uses: actions/checkout@v6
      - name: Charger les données de mémoire matérielle
        run: git lfs pull --include="01_branche_matiere/memoire_materielle_reelle/**" --exclude=""
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install --upgrade pip numpy openpyxl rarfile
      - name: Rejouer la campagne sur les données versionnées
        working-directory: 01_branche_matiere/memoire_materielle_reelle
        run: python run_all.py --sans-verification
      # Les tables dérivées doivent être identiques à celles que produit une
      # exécution propre. Une divergence signale un résultat commité à la main,
      # ou une dépendance dont la version déplace un calcul.
      - name: Contrôler que les verdicts n'ont pas bougé
        run: |
          git diff --exit-code -- 01_branche_matiere/memoire_materielle_reelle/derive             || (echo "Les verdicts régénérés diffèrent des verdicts commités."                 && git diff --stat -- 01_branche_matiere/memoire_materielle_reelle/derive                 && exit 1)

  memoire:
    name: Mémoire historique Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Tests mémoire
        working-directory: 02_branche_systeme_solaire/couche_memoire_historique
        run: PYTHONPATH="$PWD/src" python -m unittest discover -s tests
      - name: Test d'hystérèse et de bassins
        run: python -m pytest -q 02_branche_systeme_solaire/couche_memoire_historique/tests/test_hysteresis_c3.py

  astronomie:
    name: Couche astronomique Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Tests astronomiques
        working-directory: 02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests
        run: PYTHONPATH="$PWD:$PWD/src" python -m pytest -q

  campagne-maximale:
    name: Campagne maximale et reproductibilité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Conserver la référence
        run: cp -R plan_directeur/campagne_maximale_trois_branches/resultats "$RUNNER_TEMP/campagne-reference"
      - name: Recalculer les trois branches
        run: python plan_directeur/campagne_maximale_trois_branches/run_all.py
      - name: Tester la campagne
        run: python -m pytest -q plan_directeur/campagne_maximale_trois_branches/tests
      - name: Comparer les sorties
        run: |
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/campagne-reference" \
            --candidate plan_directeur/campagne_maximale_trois_branches/resultats


  genealogie-cosmique:
    name: Généalogie cosmique — données réelles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Tests généalogie cosmique
        run: python -m pytest -q 01_branche_matiere/genealogie_cosmique_quantitative/tests
      - name: Recalcul isolé et reproductibilité stricte
        run: |
          mkdir -p "$RUNNER_TEMP/gc-candidate"
          python 01_branche_matiere/genealogie_cosmique_quantitative/run_all.py --output-dir "$RUNNER_TEMP/gc-candidate"
          python scripts/verifier_reproductibilite_resultats.py \
            --reference 01_branche_matiere/genealogie_cosmique_quantitative/resultats \
            --candidate "$RUNNER_TEMP/gc-candidate" \
            --relative-tolerance 0 --absolute-tolerance 0 --ignorer-suffixes .sha256
          (cd 01_branche_matiere/genealogie_cosmique_quantitative/resultats && sha256sum -c RESULTATS.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('01_branche_matiere/genealogie_cosmique_quantitative/resultats/AUDIT_ADMISSIBILITE.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='pass'
          assert d['simulations_used_as_evidence']==0
          assert d['synthetic_rows']==0
          assert d['imputed_rows']==0
          print('pare-feu empirique: 0 simulation, 0 synthétique, 0 imputation')
          PY
      - name: Résumé scientifique généalogie cosmique
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'gc-candidate'
          d=json.loads((r/'RESULTATS_QUANTITATIFS_DONNEES_MASSIVES.json').read_text(encoding='utf-8'))
          c=json.loads((r/'RESULTATS_QUANTITATIFS_COMPLETS.json').read_text(encoding='utf-8'))
          a=d['audit']; nc=d['NC_CC']; pg=d['presolar_grains']; al=d['Allende_chondrules']['metrics']; b=d['Bennu_returned_samples']
          lines=[
            '# Généalogie cosmique — données réelles', '',
            f"- **{a['imported_rows']:,}** lignes utiles normalisées".replace(',', ' '),
            f"- **{a['published_presolar_grains']:,}** grains présolaires admissibles".replace(',', ' '),
            f"- NC/CC : **{nc['leave_one_out_correct']}/{nc['leave_one_out_total']}** sur {nc['isotope_systems']} systèmes isotopiques, sans imputation",
            f"- SiC X/M, médiane 26Al/27Al : **{pg['X_to_M_median_26Al_27Al_factor']:.2f}×**",
            f"- Allende >3σ : ε54Cr **{al['epsilon54Cr']['pairs_gt_3sigma']}/{al['epsilon54Cr']['pair_count']}**, ε50Ti **{al['epsilon50Ti']['pairs_gt_3sigma']}/{al['epsilon50Ti']['pair_count']}**, Δ17O **{al['Delta17O']['pairs_gt_3sigma']}/{al['Delta17O']['pair_count']}**",
            f"- Bennu : **{b['Bennu_2025_individual_presolar_grains']}** grains présolaires, **{b['Bennu_2026_O_isotope_spots']}** spots O, z min diopside/autres = **{b['diopside_vs_each_refractory_min_z']:.2f}**",
            f"- Chaîne primordiale → présent fermée : **{'oui' if c['graph_closure']['strict_path_primordial_baseline_to_present_endpoint'] else 'non'}**",
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as f:
              f.write(chr(10).join(lines)+chr(10))
          PY
