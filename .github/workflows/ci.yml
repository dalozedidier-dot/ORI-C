name: validation ORI-C

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Finaliser le téléchargement Git LFS
        run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - run: python scripts/valider_tout.py
