name: Validation ORI-C

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  portable:
    name: Contrôles portables Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1
      - name: Hydrater Git LFS
        run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Compiler et vérifier l'intégrité
        run: |
          python -m compileall -q .
          python verifier_dossier.py
          python scripts/verifier_fins_de_ligne.py
          python scripts/controle_avant_push.py
          python scripts/valider_tout.py --strict-lfs
      - name: Exécuter les suites portables du socle et de la matière
        run: |
          python -m pytest -q plateforme/source_corrigee/tests
          python -m pytest -q methodologie_puissance/tests
          (cd 00_socle && python -m pytest -q)
          python -m pytest -q \
            01_branche_matiere/hypergraphe_transformations/tests \
            01_branche_matiere/hypergraphe_transformations/fermeture_stricte/tests
          python -m pytest -q 01_branche_matiere/inventaire_hierarchique/tests
      # Les sorties régénérées sont comparées avec la même tolérance numérique
      # que partout ailleurs. Un `git diff` brut compare des octets : il casse
      # dès qu'une version mineure de scipy déplace un optimum de 1e-9, sans
      # qu'aucun résultat n'ait changé.
      - name: Calibrer l architecture matérielle v0.9.4
        run: |
          mkdir -p "$RUNNER_TEMP/calibrage-reference"
          cp -R 01_branche_matiere/hypergraphe_transformations/calibrage_v094/resultats \
            "$RUNNER_TEMP/calibrage-reference/"
          python 01_branche_matiere/hypergraphe_transformations/calibrage_v094/calibrage_relations.py
          python -m pytest -q 01_branche_matiere/hypergraphe_transformations/calibrage_v094/tests
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/calibrage-reference/resultats" \
            --candidate 01_branche_matiere/hypergraphe_transformations/calibrage_v094/resultats
      - name: Exécuter les priorités v0.9.3
        run: |
          python plan_directeur/campagne_priorites_v093/run_all.py
          python -m pytest -q plan_directeur/campagne_priorites_v093/tests
          python -m pytest -q 01_branche_matiere/hypergraphe_transformations/fermeture_stricte/tests
          python -m pytest -q 02_branche_systeme_solaire/transfert_climatique_intermediaire/tests
          python -m pytest -q 02_branche_systeme_solaire/couche_memoire_historique/tests/test_hysteresis_c3.py
          python -m pytest -q 03_branche_vivant/benchmark_externe_card2019/tests
          python -m pytest -q 03_branche_vivant/programme_prebiotique/tests
      - name: Exécuter et contrôler la recherche suivante
        run: |
          for dossier in \
            plan_directeur/campagne_recherche_suivante/resultats \
            01_branche_matiere/tests_causaux/resultats \
            02_branche_systeme_solaire/tests_suivants/resultats \
            03_branche_vivant/lignees_vesicules/resultats \
            03_branche_vivant/benchmark_histoire_antibiotique_2026/resultats ; do
            cible="$RUNNER_TEMP/recherche-reference/$dossier"
            mkdir -p "$cible"
            cp -R "$dossier/." "$cible/"
          done
          python plan_directeur/campagne_recherche_suivante/run_all.py
          python -m pytest -q \
            01_branche_matiere/tests_causaux/tests \
            02_branche_systeme_solaire/tests_suivants/tests \
            03_branche_vivant/lignees_vesicules/tests \
            03_branche_vivant/benchmark_histoire_antibiotique_2026/tests \
            plan_directeur/campagne_recherche_suivante/tests
          python scripts/valider_recherche_suivante.py
          for dossier in \
            plan_directeur/campagne_recherche_suivante/resultats \
            01_branche_matiere/tests_causaux/resultats \
            02_branche_systeme_solaire/tests_suivants/resultats \
            03_branche_vivant/lignees_vesicules/resultats \
            03_branche_vivant/benchmark_histoire_antibiotique_2026/resultats ; do
            python scripts/verifier_reproductibilite_resultats.py \
              --reference "$RUNNER_TEMP/recherche-reference/$dossier" \
              --candidate "$dossier"
          done
      - name: Vérifier la publication stable
        run: python scripts/valider_publication_stable.py

  # Les seize autres tâches tournent sur ubuntu-latest. Deux défauts ne
  # pouvaient donc jamais y apparaître : des fins de ligne converties en CRLF
  # au clonage, qui font diverger les empreintes du manifeste, et du code qui
  # suppose une sortie UTF-8 alors que Windows utilise la page de code du
  # système. Cette tâche reste volontairement courte et n'exporte PAS
  # PYTHONUTF8 : c'est précisément l'absence de cette variable qui révèle le
  # second défaut.
  portabilite-windows:
    name: Portabilité Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1
      - name: Hydrater Git LFS
        run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Contrôler l'intégrité après un clonage Windows
        run: python verifier_dossier.py
      - name: Contrôler que le manifeste correspond au contenu indexé
        run: python scripts/verifier_fins_de_ligne.py
      - name: Exécuter la suite du socle sans forcer l'encodage
        working-directory: 00_socle
        run: python -m pytest -q

  campagne_matiere:
    name: Campagne mémoire matérielle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Les données de la campagne sont en Git LFS : `.gitattributes` y route
      # `*.gz` et `*.zip`. Sans `lfs: true`, le runner ne reçoit que des
      # pointeurs de 130 octets et toute lecture échoue.
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Hydrater Git LFS
        run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install --upgrade pip numpy openpyxl rarfile
      - name: Rejouer la campagne sur les données versionnées
        working-directory: 01_branche_matiere/memoire_materielle_reelle
        run: python run_all.py --sans-verification
      # Les tables dérivées doivent être identiques à celles que produit une
      # exécution propre. Une divergence signale un résultat commité à la main,
      # ou une dépendance dont la version déplace un calcul.
      - name: Contrôler que les verdicts n'ont pas bougé
        run: |
          git diff --exit-code -- 01_branche_matiere/memoire_materielle_reelle/derive             || (echo "Les verdicts régénérés diffèrent des verdicts commités."                 && git diff --stat -- 01_branche_matiere/memoire_materielle_reelle/derive                 && exit 1)

  memoire:
    name: Mémoire historique Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Tests mémoire
        working-directory: 02_branche_systeme_solaire/couche_memoire_historique
        run: PYTHONPATH="$PWD/src" python -m unittest discover -s tests
      - name: Test d'hystérèse et de bassins
        run: python -m pytest -q 02_branche_systeme_solaire/couche_memoire_historique/tests/test_hysteresis_c3.py

  astronomie:
    name: Couche astronomique Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Tests astronomiques
        working-directory: 02_branche_systeme_solaire/couche_astronomique/code/ORI-C_Systeme_solaire_tests
        run: PYTHONPATH="$PWD:$PWD/src" python -m pytest -q

  campagne-maximale:
    name: Campagne maximale et reproductibilité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Conserver la référence
        run: cp -R plan_directeur/campagne_maximale_trois_branches/resultats "$RUNNER_TEMP/campagne-reference"
      - name: Recalculer les trois branches
        run: python plan_directeur/campagne_maximale_trois_branches/run_all.py
      - name: Tester la campagne
        run: python -m pytest -q plan_directeur/campagne_maximale_trois_branches/tests
      - name: Comparer les sorties
        run: |
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/campagne-reference" \
            --candidate plan_directeur/campagne_maximale_trois_branches/resultats


  genealogie-cosmique:
    name: Généalogie cosmique quantitative
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - run: git lfs pull
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt
      - run: python -m pip install -r plateforme/source_corrigee/requirements-lock.txt
      - name: Tests généalogie cosmique
        run: python -m pytest -q 01_branche_matiere/genealogie_cosmique_quantitative/tests
      - name: Recalcul isolé et reproductibilité stricte
        run: |
          mkdir -p "$RUNNER_TEMP/gc-candidate"
          python 01_branche_matiere/genealogie_cosmique_quantitative/run_all.py --output-dir "$RUNNER_TEMP/gc-candidate"
          python scripts/verifier_reproductibilite_resultats.py \
            --reference 01_branche_matiere/genealogie_cosmique_quantitative/resultats \
            --candidate "$RUNNER_TEMP/gc-candidate" \
            --relative-tolerance 0 --absolute-tolerance 0 --ignorer-suffixes .sha256
          (cd 01_branche_matiere/genealogie_cosmique_quantitative/resultats && sha256sum -c RESULTATS.sha256)
