name: Campagne centrale ORI-C — invariant transversal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '00_socle/INVARIANT_TRANSVERSAL.md'
      - '00_socle/CODEBOOK.md'
      - 'plan_directeur/PROTOCOLE_INVARIANT_TRANSVERSAL_INV_A.md'
      - 'plan_directeur/campagne_centrale_2026_08_11/**'
      - 'methodologie_puissance/pacc_causal.py'
      - 'methodologie_puissance/tests/test_pacc_causal.py'
      - 'protocoles_geles/PACC_INTERVENTIONNEL_V1.md'
      - '02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/**'
      - '03_branche_vivant/lignees_vesicules/PROTOCOLE_PACC_CAUSAL_PROSPECTIF_V1.*'
      - '03_branche_vivant/lignees_vesicules/tests/test_pacc_prospectif_gate.py'
      - '03_branche_vivant/lignees_vesicules/POWER_PLAN.json'
      - '03_branche_vivant/lignees_vesicules/VES-PACC-INT-01.registration.json'
      - '03_branche_vivant/lignees_vesicules/analyser_ves_pacc_int_01.py'
      - '03_branche_vivant/lignees_vesicules/RECHERCHE_REPLICATION_INDEPENDANTE_2026-08-12.json'
      - '03_branche_vivant/benchmark_externe_santos_lopez_2021/**'
      - '.github/workflows/campagne-centrale-invariant.yml'

permissions:
  contents: read

concurrency:
  group: campagne-centrale-invariant-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  invariant-transversal:
    name: Quantification commune et INV-A
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONHASHSEED: '0'

    steps:
      - name: Récupérer le dépôt et Git LFS
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 1

      - name: Finaliser Git LFS
        run: git lfs pull

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: plateforme/source_corrigee/requirements-lock.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plateforme/source_corrigee/requirements-lock.txt

      - name: Préparer l'artefact et conserver la référence
        run: |
          echo "OUT=$RUNNER_TEMP/oric-campagne-centrale-invariant" >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/oric-campagne-centrale-invariant/logs" \
            "$RUNNER_TEMP/oric-campagne-centrale-invariant/resultats" \
            "$RUNNER_TEMP/campagne-centrale-reference" \
            "$RUNNER_TEMP/do-m-reference"
          cp -R \
            plan_directeur/campagne_centrale_2026_08_11/resultats/. \
            "$RUNNER_TEMP/campagne-centrale-reference/"
          cp \
            02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/resultats/RESULTAT_DO_M.json \
            "$RUNNER_TEMP/do-m-reference/"

      - name: Vérifier l'intégrité initiale
        run: |
          python verifier_dossier.py \
            | tee "$OUT/logs/integrite_initiale.log"
          python scripts/valider_tout.py \
            | tee "$OUT/logs/validation_rapide.log"

      - name: Exécuter le do(m) direct du modèle exoplanétaire
        run: |
          python 02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/run_do_m.py \
            | tee "$OUT/logs/do_m_exoplanetaire.log"
          python -m pytest -q \
            02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/tests \
            | tee "$OUT/logs/tests_do_m_exoplanetaire.log"
          mkdir -p "$RUNNER_TEMP/do-m-candidate"
          cp \
            02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/resultats/RESULTAT_DO_M.json \
            "$RUNNER_TEMP/do-m-candidate/"
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/do-m-reference" \
            --candidate "$RUNNER_TEMP/do-m-candidate" \
            | tee "$OUT/logs/reproductibilite_do_m.log"

      - name: Valider PACC-INT-CHALLENGE-V1 sur EXO-DOM-01
        run: |
          python 02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/valider_pacc_interventionnel_v1.py \
            | tee "$OUT/logs/validation_pacc_interventionnel_v1.log"
          python - <<'PY' | tee "$OUT/logs/controle_validation_pacc.log"
          import json
          from pathlib import Path
          path = Path('02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/resultats/VALIDATION_PACC_INTERVENTIONNEL_V1.json')
          result = json.loads(path.read_text(encoding='utf-8'))
          if result.get('passed') is not True:
              raise SystemExit(f"validation PACC échouée: {result}")
          if result.get('counts_for_section_xiv_condition_9') is not False:
              raise SystemExit('le test de sanité modèle ne doit jamais fermer §XIV-9')
          print('PACC-INT-CHALLENGE-V1 reproduit EXO-DOM-01 sans relèvement de preuve.')
          PY

      - name: Exécuter la campagne centrale
        run: |
          python plan_directeur/campagne_centrale_2026_08_11/run_all.py \
            | tee "$OUT/logs/campagne_centrale.log"

      - name: Tester la campagne centrale
        run: |
          python -m pytest -q \
            plan_directeur/campagne_centrale_2026_08_11/tests \
            03_branche_vivant/lignees_vesicules/tests/test_pacc_prospectif_gate.py \
            | tee "$OUT/logs/tests_campagne_centrale.log"

      - name: Vérifier les résultats INV-A attendus
        run: |
          python - <<'PY' | tee "$OUT/logs/controle_resultats_inv_a.log"
          import json
          from pathlib import Path

          root = Path('plan_directeur/campagne_centrale_2026_08_11/resultats')
          required = [
              'ADMISSION_PALEO_HISTORY_01.json',
              'DATASET_TEST_MATRIX.json',
              'DEPENDANCES_SCIENTIFIQUES.json',
              'BENCHMARK_TRANSVERSAL.json',
              'COMPLETUDE_21_CAS.json',
              'AUDIT_INVARIANTS.json',
              'MESURES_COMMUNES_EXECUTEES.json',
              'REGISTRE_BIFURCATIONS.json',
              'CONTRASTES_ACCESSIBILITE_INV_A.json',
              'AUDIT_INV_A.json',
              'SEUIL_XIV.json',
              'PACC_QUALIFICATION_STRICTE.json',
              'PREDICTIONS_HORS_ECHANTILLON_AUDIT.json',
              'REPLICATIONS_INDEPENDANTES_AUDIT.json',
              'TRANSFERT_SANS_REDEFINITION_AUDIT.json',
              'ANTIBIOTIQUES_SPECIFICATIONS_AUDIT.json',
              'ETAT_CAMPAGNE.json',
          ]

          loaded = {}
          for name in required:
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Résultat manquant : {name}')
              loaded[name] = json.loads(path.read_text(encoding='utf-8'))

          audit = loaded['AUDIT_INV_A.json']
          etat = loaded['ETAT_CAMPAGNE.json']
          benchmark = loaded['BENCHMARK_TRANSVERSAL.json']
          section_xiv = loaded['SEUIL_XIV.json']

          if section_xiv.get('passed_count') != 7 or section_xiv.get('missing_ids') != [3, 4, 9, 10, 11]:
              raise SystemExit(f"État §XIV inattendu : {section_xiv}")

          for key in [
              'current_status',
              'direct_m_ablation_system_count',
              'direct_positive_m_ablation_system_count',
          ]:
              if key not in audit:
                  raise SystemExit(f'Champ AUDIT_INV_A manquant : {key}')

          if 'inv_a_status' not in etat:
              raise SystemExit('Champ ETAT_CAMPAGNE manquant : inv_a_status')
          if 'case_count' not in benchmark:
              raise SystemExit('Champ BENCHMARK_TRANSVERSAL manquant : case_count')

          print('Résultats centraux présents et JSON valides.')
          print(f"INV-A : {audit['current_status']}")
          print(
              'Systèmes avec ablation directe de m : '
              f"{audit['direct_m_ablation_system_count']}"
          )
          print(
              'Systèmes avec soutien positif direct : '
              f"{audit['direct_positive_m_ablation_system_count']}"
          )
          print(f"Cas benchmark : {benchmark['case_count']}")
          print(f"§XIV : {section_xiv['passed_count']}/12; verrous={section_xiv['missing_ids']}")
          PY

      - name: Vérifier la reproductibilité des sorties centrales
        run: |
          python scripts/verifier_reproductibilite_resultats.py \
            --reference "$RUNNER_TEMP/campagne-centrale-reference" \
            --candidate plan_directeur/campagne_centrale_2026_08_11/resultats \
            | tee "$OUT/logs/reproductibilite_campagne_centrale.log"

      - name: Rassembler résultats, protocoles et environnement
        if: always()
        run: |
          cp -R \
            plan_directeur/campagne_centrale_2026_08_11/resultats/. \
            "$OUT/resultats/" 2>/dev/null || true
          cp \
            00_socle/INVARIANT_TRANSVERSAL.md \
            "$OUT/" 2>/dev/null || true
          cp \
            plan_directeur/PROTOCOLE_INVARIANT_TRANSVERSAL_INV_A.md \
            "$OUT/" 2>/dev/null || true
          cp \
            plan_directeur/campagne_centrale_2026_08_11/INVARIANT_TRANSVERSAL_INV_A.json \
            "$OUT/" 2>/dev/null || true
          cp \
            plan_directeur/campagne_centrale_2026_08_11/FORMALISME_QUANTITATIF.json \
            "$OUT/" 2>/dev/null || true
          cp \
            plan_directeur/campagne_centrale_2026_08_11/FALSIFICATION_ORI-C.md \
            "$OUT/" 2>/dev/null || true
          mkdir -p "$OUT/do_m_exoplanetaire"
          cp \
            02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/PROTOCOLE.json \
            02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/PROTOCOLE.md \
            02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/resultats/RESULTAT_DO_M.json \
            02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/resultats/VALIDATION_PACC_INTERVENTIONNEL_V1.json \
            "$OUT/do_m_exoplanetaire/" 2>/dev/null || true
          mkdir -p "$OUT/vesicules"
          cp \
            03_branche_vivant/lignees_vesicules/PROTOCOLE_PACC_CAUSAL_PROSPECTIF_V1.md \
            03_branche_vivant/lignees_vesicules/PROTOCOLE_PACC_CAUSAL_PROSPECTIF_V1.json \
            03_branche_vivant/lignees_vesicules/POWER_PLAN.json \
            03_branche_vivant/lignees_vesicules/VES-PACC-INT-01.registration.json \
            03_branche_vivant/lignees_vesicules/analyser_ves_pacc_int_01.py \
            "$OUT/vesicules/" 2>/dev/null || true
          git diff --binary -- \
            plan_directeur/campagne_centrale_2026_08_11/resultats \
            02_branche_systeme_solaire/couche_memoire_historique/do_m_trace/resultats \
            > "$OUT/regeneration.diff" || true
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path(os.environ['OUT'])
          payload = {
              'workflow': 'campagne-centrale-invariant',
              'commit': os.environ.get('GITHUB_SHA'),
              'event': os.environ.get('GITHUB_EVENT_NAME'),
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'result_directory': 'plan_directeur/campagne_centrale_2026_08_11/resultats',
              'scientific_scope': (
                  'Exécution de la quantification commune et de l audit INV-A. '
                  'Le verdict machine est conservé quel que soit son signe et '
                  'ne constitue pas automatiquement une validation générale d ORI-C.'
              ),
          }
          (out / 'execution.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          python -m pip freeze > "$OUT/pip-freeze.txt"

      - name: Publier les résultats de la campagne centrale
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: campagne-centrale-invariant-${{ github.sha }}
          path: ${{ runner.temp }}/oric-campagne-centrale-invariant
          if-no-files-found: error
          retention-days: 30
